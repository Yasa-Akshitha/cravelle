# Cravelle Backend Application Configuration

server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=cravelle-backend

# Database Configuration (MySQL as primary, fallback to in-memory H2 if DB_URL is not configured)
spring.datasource.url=${DB_URL:jdbc:h2:mem:cravelledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Security & JWT
cravelle.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d0e2b4a6c8e1d3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c}
cravelle.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cravelle.jwt.issuer=cravelle.com

# CORS Configuration
cravelle.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://cravelle.vercel.app}

# AI Chatbot Configuration
cravelle.ai.api-key=${AI_API_KEY:}
cravelle.ai.model=${AI_MODEL:gemini-1.5-flash}
cravelle.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
cravelle.ai.timeout-seconds=25

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
