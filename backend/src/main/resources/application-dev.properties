# Cravelle Backend Local Development Configuration

server.port=8080

spring.datasource.url=jdbc:h2:mem:cravelledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

cravelle.jwt.secret=9a4f2c8d7e1b5a3f6c8d0e2b4a6c8e1d3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c
cravelle.cors.allowed-origins=http://localhost:5173,http://localhost:3000
