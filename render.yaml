services:
  - type: web
    name: cravelle-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://cravelle-eight.vercel.app,https://cravelle.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
